<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder review</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="base.css">
<style>
  html, body { height: 100%; }
  body { display: grid; grid-template-rows: var(--header-h) 1fr; color: var(--ink); font-size: var(--fs-md); }
  header { display: flex; align-items: center; gap: 12px; padding: 0 var(--pad); border-bottom: 1px solid var(--line); background: var(--surface); }
  header h1 { margin: 0; font-size: var(--fs-lg); font-weight: 500; }
  header .muted, .muted { color: var(--muted); }
  header a { margin-left: auto; color: var(--ink); }
  header a[hidden] + .open { margin-left: auto; }
  main { display: grid; grid-template-columns: 260px 1fr 260px; min-height: 0; }
  .panel { border-right: 1px solid var(--line); }
  .panel.right { border-right: 0; border-left: 1px solid var(--line); }
  .stage { position: relative; min-width: 0; background: var(--viewport-bg); }
  .stage canvas { display: block; width: 100%; height: 100%; }
  .views { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
  .steps { position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; align-items: center; }
  .note { position: absolute; top: 8px; left: 8px; max-width: 60%; color: var(--muted); font-size: var(--fs-sm); }
  .list li { cursor: pointer; }
  .list li .badge { font-size: var(--fs-xs); }
  .list li.look .badge { border-color: var(--danger); color: var(--danger); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; margin: 0; }
  dt { color: var(--muted); }
  dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  dd.bad { color: var(--danger); }
  .source { color: var(--muted); font-size: var(--fs-sm); overflow-wrap: anywhere; margin: 0 0 6px; }
  .swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }
  .check span { flex: 1; }
  .segmented { margin-bottom: 6px; }
  .open { display: flex; gap: 4px; }
  .open input { display: none; }
  body.dragging .stage { outline: 2px dashed var(--accent, var(--ink)); outline-offset: -6px; }
</style>
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }</script>
</head>
<body>
<header>
  <h1>Folder review</h1>
  <span class="muted" id="totals"></span>
  <a href="/out/summary.csv" download id="csv">summary.csv</a>
  <span class="open">
    <input type="file" id="pick-folder" webkitdirectory><button data-pick="pick-folder">Open folder</button>
    <input type="file" id="pick-files" multiple accept=".json,.glb,.csv"><button data-pick="pick-files">Open files</button>
  </span>
</header>
<main>
  <div class="panel">
    <div class="segmented" role="group">
      <button id="show-look" aria-pressed="true">Needs a look</button>
      <button id="show-all" aria-pressed="false">All</button>
    </div>
    <ul class="list" id="cases"></ul>
  </div>
  <div class="stage" id="stage">
    <div class="note" id="note"></div>
    <div class="views">
      <button data-view="fit">Fit view</button>
      <button data-view="top">Top view</button>
      <button data-view="bottom">Bottom view</button>
      <button data-view="side">Side view</button>
    </div>
    <div class="steps">
      <button id="prev">Previous</button>
      <span class="muted" id="position"></span>
      <button id="next">Next</button>
    </div>
  </div>
  <div class="panel right">
    <section>
      <h3>Case</h3>
      <p class="source" id="source"></p>
      <dl id="facts"></dl>
    </section>
    <section>
      <h3>Layers</h3>
      <div id="layers"></div>
    </section>
  </div>
</main>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// Plain names for the review layers (the GLB names start with the colour word set in Rust).
const LAYERS = [
  ['TEAL', 'Support area (where tips may go)', true],
  ['NEUTRAL', 'Rest of the aligner', true],
  ['BLUE', 'Outer edge, detected', true],
  ['GREEN', 'Outer edge, joining paths', true],
  ['RED', 'Inner opening edge, detected', true],
  ['GOLD', 'Supports', true],
  ['ORANGE', 'Support tips', true],
  ['MARK support crosses', 'Support crosses the aligner', true],
  ['MARK crossing that', 'Crossing that could not be judged', true],
  ['MARK low point with', 'Low point with no support', true],
  ['MARK low point outside', 'Low point outside the support area', false],
  ['VIOLET', 'Diagnostic: outer strip, opening side', false],
  ['AMBER', 'Diagnostic: outer strip, other side', false],
  ['CYAN', 'Diagnostic: inner strip, opening side', false],
  ['MAGENTA', 'Diagnostic: inner strip, other side', false],
  ['LIME', 'Diagnostic: outer sample points', false],
  ['PINK', 'Diagnostic: inner sample points', false],
];
// GLTFLoader turns spaces in node names into underscores; compare with them put back.
const plain = (name) => (name ?? '').replace(/_/g, ' ');
const layerOf = (name) => LAYERS.find(([prefix]) => plain(name).startsWith(prefix));
const visible = new Map(LAYERS.map(([prefix, , on]) => [prefix, on]));

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
stage.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(getComputedStyle(document.body).getPropertyValue('--viewport-bg').trim() || '#e9e6df');
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
scene.add(camera, new THREE.HemisphereLight(0xffffff, 0x8a847a, 1.6));
const light = new THREE.DirectionalLight(0xffffff, 1.4);
light.position.set(1, 2, 3);
camera.add(light);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
let model = null;
// Below the floor (the bottom of the supports and raft) only the aligner and its tips show.
let floorY = null;
let underside = false;

function resize() {
  const { clientWidth: w, clientHeight: h } = stage;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);
renderer.setAnimationLoop(() => {
  controls.update();
  const below = floorY !== null && camera.position.y < floorY;
  if (below !== underside) { underside = below; applyVisibility(); }
  renderer.render(scene, camera);
});

function look(direction) {
  if (!model) return;
  const sphere = new THREE.Box3().setFromObject(model).getBoundingSphere(new THREE.Sphere());
  const fov = THREE.MathUtils.degToRad(camera.fov) / 2;
  const distance = sphere.radius / Math.sin(Math.min(fov, Math.atan(Math.tan(fov) * camera.aspect))) * 1.05;
  controls.target.copy(sphere.center);
  camera.position.copy(sphere.center).addScaledVector(direction.normalize(), distance);
  camera.up.set(0, 1, 0);
  camera.near = distance / 100; camera.far = distance * 10;
  camera.updateProjectionMatrix();
}
const VIEWS = { fit: () => new THREE.Vector3(0.6, 0.7, 1), top: () => new THREE.Vector3(0.001, 1, 0.001), bottom: () => new THREE.Vector3(0.001, -1, 0.001), side: () => new THREE.Vector3(0, 0.15, 1) };
document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => look(VIEWS[button.dataset.view]())));

function applyVisibility() {
  model?.traverse((object) => {
    const layer = object.name && layerOf(object.name);
    if (layer) object.visible = visible.get(layer[0]) && !(underside && layer[0] === 'GOLD');
  });
}

function drawLayers() {
  const present = new Set();
  model?.traverse((object) => { const layer = object.name && layerOf(object.name); if (layer) present.add(layer[0]); });
  const box = document.getElementById('layers');
  box.replaceChildren(...LAYERS.filter(([prefix]) => present.has(prefix)).map(([prefix, label]) => {
    const row = document.createElement('label');
    row.className = 'check';
    const input = Object.assign(document.createElement('input'), { type: 'checkbox', checked: visible.get(prefix) });
    input.addEventListener('change', () => { visible.set(prefix, input.checked); applyVisibility(); });
    const swatch = document.createElement('i');
    swatch.className = 'swatch';
    let colour = '#ccc';
    model.traverse((object) => { if (object.isMesh && (plain(object.name).startsWith(prefix) || plain(object.parent?.name).startsWith(prefix))) colour = '#' + object.material.color.getHexString(); });
    swatch.style.background = colour;
    const text = document.createElement('span');
    text.textContent = label;
    row.append(input, swatch, text);
    return row;
  }));
}

const loader = new GLTFLoader();
async function show(row) {
  if (model) { scene.remove(model); model.traverse((o) => { o.geometry?.dispose(); o.material?.dispose?.(); }); model = null; floorY = null; }
  const url = row.glb ? urlOf(row.glb) : '';
  document.getElementById('note').textContent = url ? 'Loading...'
    : row.glb ? `${row.glb} was not in what was dropped. Drop the whole batch-... folder.`
    : `No 3D result: ${row.result}${row.reason ? ` (${row.reason})` : ''}`;
  if (url) {
    const gltf = await loader.loadAsync(url);
    model = gltf.scene;
    model.traverse((object) => {
      // Markers draw over everything, so a crossing inside a support body still shows.
      if (object.isMesh && plain(object.parent?.name).startsWith('MARK')) {
        object.material.depthTest = false;
        object.renderOrder = 10;
      }
      // Shade the surfaces so the shape reads; markers and tubes keep their flat colour.
      if (object.isMesh && /^(TEAL|NEUTRAL|GOLD|ORANGE)/.test(object.name)) {
        if (!object.geometry.attributes.normal) object.geometry.computeVertexNormals();
        object.material = new THREE.MeshStandardMaterial({ color: object.material.color, roughness: 0.85, side: THREE.DoubleSide });
      }
    });
    scene.add(model);
    const supports = new THREE.Box3();
    model.traverse((object) => { if (object.isMesh && layerOf(object.name)?.[0] === 'GOLD') supports.expandByObject(object); });
    floorY = supports.isEmpty() ? null : supports.min.y;
    underside = false;
    applyVisibility();
    look(VIEWS.fit());
    document.getElementById('note').textContent = '';
  }
  drawLayers();
}

// A run comes from the server (/out/) or from files dropped on the page; urlOf maps a GLB name to where it loads from.
let cases = [];
let urlOf = (name) => `/out/${name}`;
let blobs = [];
let onlyLook = false;
let current = 0;

function openRun(summary, glbUrl, csvUrl) {
  cases = summary.cases;
  urlOf = glbUrl;
  const needing = cases.filter((c) => c.needsLook);
  const made = summary.created ? `, made ${new Date(summary.created).toLocaleString()}` : '';
  document.getElementById('totals').textContent = `${cases.length} file(s), ${needing.length} need a look${made}`;
  const csv = document.getElementById('csv');
  csv.hidden = !csvUrl;
  if (csvUrl) csv.href = csvUrl;
  onlyLook = needing.length > 0;
  select(0);
}

function empty(message) {
  document.getElementById('totals').textContent = '';
  document.getElementById('csv').hidden = true;
  document.getElementById('note').textContent = message;
}

// Dropped or chosen files: a batch-... folder (summary.json + case GLBs), or GLB files alone.
// When several runs are in the drop, the newest summary.json wins and only GLBs beside it are used.
async function openFiles(entries) {
  blobs.forEach((url) => URL.revokeObjectURL(url));
  blobs = [];
  const dirOf = (path) => path.slice(0, path.lastIndexOf('/') + 1);
  const nameOf = (path) => path.slice(path.lastIndexOf('/') + 1);
  const blob = (file) => { const url = URL.createObjectURL(file); blobs.push(url); return url; };
  let run = null;
  for (const { path, file } of entries.filter(({ path }) => nameOf(path) === 'summary.json')) {
    try {
      const summary = JSON.parse(await file.text());
      if (Array.isArray(summary.cases) && (!run || (summary.created ?? '') > (run.summary.created ?? ''))) run = { summary, dir: dirOf(path) };
    } catch { /* not a review summary */ }
  }
  const glbs = entries.filter(({ path }) => /\.glb$/i.test(path) && (!run || dirOf(path) === run.dir));
  if (!run && glbs.length === 0) { empty('No summary.json or .glb file in what was dropped. Drop a batch-... folder from dentalwork/output.'); return; }
  const byName = new Map(glbs.map(({ path, file }) => [nameOf(path), file]));
  const summary = run?.summary ?? {
    cases: glbs.map(({ path }) => ({ case: nameOf(path).replace(/\.glb$/i, ''), source: path, result: 'built', glb: nameOf(path), needsLook: false })),
  };
  const missing = summary.cases.filter((c) => c.glb && !byName.has(c.glb));
  const csv = run && entries.find(({ path }) => path === `${run.dir}summary.csv`);
  openRun(summary, (name) => (byName.has(name) ? blob(byName.get(name)) : ''), csv ? blob(csv.file) : '');
  if (missing.length) document.getElementById('totals').textContent += `, ${missing.length} GLB(s) not in the drop`;
}

async function readEntry(entry) {
  if (entry.isFile) return [{ path: entry.fullPath, file: await new Promise((ok, fail) => entry.file(ok, fail)) }];
  const reader = entry.createReader();
  const children = [];
  for (let batch; (batch = await new Promise((ok, fail) => reader.readEntries(ok, fail))).length;) children.push(...batch);
  return (await Promise.all(children.map(readEntry))).flat();
}

addEventListener('dragover', (event) => { event.preventDefault(); document.body.classList.add('dragging'); });
addEventListener('dragleave', (event) => { if (!event.relatedTarget) document.body.classList.remove('dragging'); });
addEventListener('drop', async (event) => {
  event.preventDefault();
  document.body.classList.remove('dragging');
  const roots = [...event.dataTransfer.items].map((item) => item.webkitGetAsEntry?.()).filter(Boolean);
  openFiles((await Promise.all(roots.map(readEntry))).flat());
});
document.querySelectorAll('[data-pick]').forEach((button) => button.addEventListener('click', () => document.getElementById(button.dataset.pick).click()));
for (const id of ['pick-folder', 'pick-files']) {
  const input = document.getElementById(id);
  input.addEventListener('change', () => {
    openFiles([...input.files].map((file) => ({ path: `/${file.webkitRelativePath || file.name}`, file })));
    input.value = '';
  });
}
const shown = () => (onlyLook ? cases.filter((c) => c.needsLook) : cases);

const status = (c) => (c.result !== 'built' ? c.result : c.verdict);
function facts(c) {
  const rows = [
    ['Result', c.result, c.result !== 'built'],
    ['Safety check', c.verdict || '-', c.verdict && c.verdict !== 'clear'],
    ['Supports crossing the aligner', c.crossings, c.crossings > 0],
    ['Crossings not judged', c.uncertain, c.uncertain > 0],
    ['Low points with no support', c.islandsUnresolved, c.islandsUnresolved > 0],
    ['Low points outside the area', c.islandsOutsideArea, false],
    ['Print angle', c.printAngleDeg == null ? '-' : `${c.printAngleDeg}° (stable ${c.stableBand || 'none'})${c.printAngleDeg == null ? '' : c.angleConfirmed ? ', confirm build passed' : ', confirm build did not pass'}`, false],
    ['Structures left out', c.structuresLeftOut || 'none', false],
    ['Tips placed', c.tipsPlaced, false],
    ['Tips left out', c.tipsLeftOut, false],
    ['Largest gap, outer edge (mm)', c.outerGapMm ?? '-', false],
    ['Largest gap, opening (mm)', c.openingGapMm ?? '-', false],
    ['Edge coverage needs review', c.rimNeedsReview ? 'yes' : 'no', c.rimNeedsReview],
    ['Time (s)', c.seconds, false],
  ];
  if (c.reason) rows.push(['Reason', c.reason, true]);
  document.getElementById('facts').replaceChildren(...rows.flatMap(([k, v, bad]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = String(v ?? '-'); if (bad) dd.className = 'bad';
    return [dt, dd];
  }));
  document.getElementById('source').textContent = c.source ?? '';
}

function drawList() {
  const list = shown();
  document.getElementById('cases').replaceChildren(...list.map((c, k) => {
    const li = document.createElement('li');
    li.className = `${c.needsLook ? 'look' : ''} ${k === current ? 'selected current' : ''}`;
    const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = c.needsLook ? '!' : '✓';
    const name = document.createElement('span'); name.textContent = c.case;
    const small = document.createElement('small'); small.textContent = status(c);
    li.append(badge, name, small);
    li.addEventListener('click', () => select(k));
    return li;
  }));
  document.getElementById('show-look').setAttribute('aria-pressed', String(onlyLook));
  document.getElementById('show-all').setAttribute('aria-pressed', String(!onlyLook));
}

function select(k) {
  const list = shown();
  if (list.length === 0) { drawList(); document.getElementById('position').textContent = ''; return; }
  current = Math.max(0, Math.min(list.length - 1, k));
  drawList();
  document.getElementById('position').textContent = `${current + 1} / ${list.length}`;
  facts(list[current]);
  show(list[current]);
}
document.getElementById('show-look').addEventListener('click', () => { onlyLook = true; select(0); });
document.getElementById('show-all').addEventListener('click', () => { onlyLook = false; select(0); });
document.getElementById('prev').addEventListener('click', () => select(current - 1));
document.getElementById('next').addEventListener('click', () => select(current + 1));
addEventListener('keydown', (event) => {
  if (event.key === 'ArrowDown' || event.key === 'PageDown') select(current + 1);
  if (event.key === 'ArrowUp' || event.key === 'PageUp') select(current - 1);
});
const served = await fetch('/out/summary.json').then((r) => (r.ok ? r.json() : null)).catch(() => null);
if (served) openRun(served, (name) => `/out/${name}`, '/out/summary.csv');
else empty('Drop a batch-... folder from dentalwork/output here, or its summary.json with the case GLBs. Open folder and Open files do the same.');
</script>
</body>
</html>
